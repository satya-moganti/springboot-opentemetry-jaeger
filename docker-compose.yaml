version: '3.8'

services:

  # ─── Infrastructure ───────────────────────────────────────────────────────

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    ports:
      - "16686:16686"   # Jaeger UI
      - "4318:4318"     # OTLP HTTP
      - "4317:4317"     # OTLP gRPC
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - spring-net

  service-registry:
    build:
      context: ./service-registry
      dockerfile: Dockerfile
    container_name: service-registry
    ports:
      - "8761:8761"
    environment:
      - EUREKA_HOST=service-registry
      - EUREKA_PORT=8761
    networks:
      - spring-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  configserver:
    build:
      context: ./configserver
      dockerfile: Dockerfile
    container_name: configserver
    ports:
      - "7100:7100"
    environment:
      - EUREKA_HOST=service-registry
      - EUREKA_PORT=8761
      - CONFIG_SERVER_PORT=7100
    depends_on:
      service-registry:
        condition: service_healthy
    networks:
      - spring-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:7100/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─── Microservices ────────────────────────────────────────────────────────

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8099:8099"
    environment:
      - CONFIG_SERVER_HOST=configserver
      - CONFIG_SERVER_PORT=7100
      - EUREKA_HOST=service-registry
      - EUREKA_PORT=8761
      - JAEGER_HOST=jaeger
      - JAEGER_PORT=4318
    depends_on:
      configserver:
        condition: service_healthy
    networks:
      - spring-net

  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: order-service
    ports:
      - "8100:8100"
    environment:
      - CONFIG_SERVER_HOST=configserver
      - CONFIG_SERVER_PORT=7100
      - EUREKA_HOST=service-registry
      - EUREKA_PORT=8761
      - JAEGER_HOST=jaeger
      - JAEGER_PORT=4318
    depends_on:
      configserver:
        condition: service_healthy
    networks:
      - spring-net

  inventory-service:
    build:
      context: ./inventory-service
      dockerfile: Dockerfile
    container_name: inventory-service
    ports:
      - "8900:8900"
    environment:
      - CONFIG_SERVER_HOST=configserver
      - CONFIG_SERVER_PORT=7100
      - EUREKA_HOST=service-registry
      - EUREKA_PORT=8761
      - JAEGER_HOST=jaeger
      - JAEGER_PORT=4318
    depends_on:
      configserver:
        condition: service_healthy
    networks:
      - spring-net

  cart-service:
    build:
      context: ./cart-service
      dockerfile: Dockerfile
    container_name: cart-service
    ports:
      - "8300:8300"
    environment:
      - CONFIG_SERVER_HOST=configserver
      - CONFIG_SERVER_PORT=7100
      - EUREKA_HOST=service-registry
      - EUREKA_PORT=8761
      - JAEGER_HOST=jaeger
      - JAEGER_PORT=4318
    depends_on:
      configserver:
        condition: service_healthy
    networks:
      - spring-net

networks:
  spring-net:
    driver: bridge
