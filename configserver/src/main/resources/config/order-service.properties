server.port=8100

# ========== Tracing settings ==========
# Always sample 100% of traces
management.tracing.sampling.probability=1.0

# Send traces to Jaeger BE
management.otlp.tracing.endpoint=http://${JAEGER_HOST:localhost}:${JAEGER_PORT:4318}/v1/traces

# Enable trace propagation
management.tracing.propagation.type=W3C
management.tracing.propagation.produce=W3C
management.tracing.propagation.consume=W3C

# Enable Feign client instrumentation (Spring Boot 3.x auto-configures this)
# Ensures trace context is propagated through Feign clients
spring.sleuth.feign.enabled=true

# Eureka settings
eureka.instance.prefer-ip-address=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.serviceUrl.defaultZone=http://${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka/