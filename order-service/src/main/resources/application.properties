spring.application.name=order-service
spring.config.import=optional:configserver:http://${CONFIG_SERVER_HOST:localhost}:${CONFIG_SERVER_PORT:7100}

# ========== Actuator Configuration ==========
# Expose all actuator endpoints (health, info, metrics, etc.)
management.endpoints.web.exposure.include=*
# Enable specific endpoints
management.endpoint.health.show-details=always
management.info.env.enabled=true

# ========== Feign Logging Configuration ==========
# Enable DEBUG level logging for Feign clients
logging.level.com.jayam.order_service.client=DEBUG

# Optional: Set root logging level
logging.level.root=INFO

# Optional: Enable request/response logging for debugging
logging.level.feign=DEBUG

# ========== Resilience4j Configuration ==========
# Import resilience4j configuration
spring.profiles.include=resilience
